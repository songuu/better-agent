openapi: 3.1.0
info:
  title: Breaking response fixture
  version: 2.0.0
paths:
  /widgets/{widget_id}:
    get:
      operationId: getWidget
      parameters:
        - name: widget_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A widget with a breaking response type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Widget'
components:
  schemas:
    Widget:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: number
