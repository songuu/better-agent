openapi: 3.1.0
info:
  title: Valid fixture
  version: 1.0.0
paths:
  /widgets/{widget_id}:
    get:
      operationId: getWidget
      parameters:
        - name: widget_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A widget
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Widget'
              example:
                id: widget-1
components:
  schemas:
    PublicRedactedPayload:
      oneOf:
        - type: string
        - type: number
        - type: boolean
        - type: 'null'
        - type: array
          items:
            $ref: '#/components/schemas/PublicRedactedPayload'
        - type: object
          additionalProperties:
            $ref: '#/components/schemas/PublicRedactedPayload'
    Widget:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: string
