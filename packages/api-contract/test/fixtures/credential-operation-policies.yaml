openapi: 3.1.0
info:
  title: Credential operation policy fixture
  version: 1.0.0
x-credential-operation-policy-contract:
  version: CredentialOperationPolicyV1
  persistence: derived_only
x-subject-assertion-contract:
  version: subject-assertion-jws-eddsa/1
  serialization: compact_jws
  alg: EdDSA
  typ: ba-subject-assertion+jwt
  claim_version: subject-assertion/1
  key_selection: pinned_local_key_version
  kid_format: '{issuer_config_id}.v{key_version}'
  max_ttl_seconds: 300
  max_clock_skew_seconds: 30
  required_claims: [version, issuer_config_id, iss, sub, aud, nonce, iat, exp, origin, key_version]
  raw_assertion_persistence: forbidden
paths:
  /exchange:
    post:
      operationId: exchangeBrowserSession
      security: [{ workspaceAccessKey: [], workspaceId: [] }]
      x-service-credential-policy:
        schema_version: credential-operation-policy/1
        operation_purpose: deployment_publish
        allowed_kinds: [publish]
        required_scopes: ['browser-session:exchange']
        typed_grant_family: agent_deployment_entry_grants
        target_cardinality: exactly_one_deployment
  /conversations:
    post:
      operationId: createAgentConversation
      security: [{ workspaceAccessKey: [], workspaceId: [] }, { browserSessionBearer: [] }]
      x-service-credential-policy: &agent-write-policy
        schema_version: credential-operation-policy/1
        operation_purpose: agent_invoke
        allowed_kinds: [service_api]
        required_scopes: ['agent:conversation:write']
        typed_grant_family: agent_deployment_entry_grants
        target_cardinality: exactly_one_deployment
    get:
      operationId: listAgentConversations
      security: [{ workspaceAccessKey: [], workspaceId: [] }, { browserSessionBearer: [] }]
      x-service-credential-policy: &agent-read-policy
        schema_version: credential-operation-policy/1
        operation_purpose: agent_invoke
        allowed_kinds: [service_api]
        required_scopes: ['agent:conversation:read']
        typed_grant_family: agent_deployment_entry_grants
        target_cardinality: exactly_one_deployment
  /conversation-messages:
    get:
      operationId: listAgentConversationMessages
      security: [{ workspaceAccessKey: [], workspaceId: [] }, { browserSessionBearer: [] }]
      x-service-credential-policy: *agent-read-policy
  /chat:
    post:
      operationId: createAgentChatRun
      security: [{ workspaceAccessKey: [], workspaceId: [] }, { browserSessionBearer: [] }]
      x-service-credential-policy:
        schema_version: credential-operation-policy/1
        operation_purpose: agent_invoke
        allowed_kinds: [service_api]
        required_scopes: ['agent:run:create']
        typed_grant_family: agent_deployment_entry_grants
        target_cardinality: exactly_one_deployment
  /flow:
    post:
      operationId: createFlowRun
      security: [{ workspaceAccessKey: [], workspaceId: [] }]
      x-service-credential-policy:
        schema_version: credential-operation-policy/1
        operation_purpose: flow_invoke
        allowed_kinds: [service_api]
        required_scopes: ['flow:run:create']
        typed_grant_family: flow_deployment_entry_grants
        target_cardinality: exactly_one_flow
  /run:
    get:
      operationId: getRun
      security: [{ workspaceAccessKey: [], workspaceId: [] }, { browserSessionBearer: [] }]
      x-service-credential-policy: &run-read-policy
        schema_version: credential-operation-policy/1
        operation_purpose: run_read
        allowed_kinds: [service_api]
        required_scopes: ['run:read']
        typed_grant_family: original_run_entry_grant
        allowed_original_run_target_kinds: [agent, flow]
        target_cardinality: original_run_only
  /run/cancel:
    post:
      operationId: requestRunCancellation
      security: [{ workspaceAccessKey: [], workspaceId: [] }, { browserSessionBearer: [] }]
      x-service-credential-policy:
        schema_version: credential-operation-policy/1
        operation_purpose: run_cancel
        allowed_kinds: [service_api]
        required_scopes: ['run:cancel']
        typed_grant_family: original_run_entry_grant
        allowed_original_run_target_kinds: [agent, flow]
        target_cardinality: original_run_only
  /run/resume:
    post:
      operationId: resumeHumanGate
      security: [{ workspaceAccessKey: [], workspaceId: [] }, { browserSessionBearer: [] }]
      x-service-credential-policy:
        schema_version: credential-operation-policy/1
        operation_purpose: run_resume
        allowed_kinds: [service_api]
        required_scopes: ['run:resume']
        typed_grant_family: original_run_entry_grant
        allowed_original_run_target_kinds: [agent, flow]
        target_cardinality: original_run_only
  /run/events:
    get:
      operationId: streamRunEvents
      security: [{ workspaceAccessKey: [], workspaceId: [] }, { runEventSessionCookie: [] }]
      x-service-credential-policy:
        schema_version: credential-operation-policy/1
        operation_purpose: run_events_read
        allowed_kinds: [service_api]
        required_scopes: ['run:events:read']
        typed_grant_family: original_run_entry_grant
        allowed_original_run_target_kinds: [agent, flow]
        target_cardinality: original_run_only
  /run/events/session:
    post:
      operationId: createBrowserRunEventSession
      security: [{ browserSessionBearer: [] }]
      x-browser-origin-policy:
        security_scheme: browserSessionBearer
        origin_parameter: BrowserOriginRequired
        canonicalization: rfc6454_ascii_serialization
        compare_with: [session_origin, current_deployment_exact_allowlist]
        cross_origin_header_required: true
        allow_null_origin: false
        cors_allow_origin: exact_echo
        cors_vary_origin: true
        cors_wildcard_with_credentials: false
